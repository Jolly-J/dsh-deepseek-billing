name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness
          fetch-depth: 1

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: harness/packages/extensions/dsh-deepseek-billing

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install Harness dependencies
        working-directory: harness
        run: pnpm install --no-frozen-lockfile

      - name: Exclude third-party plugin tests from the host aggregate
        working-directory: harness
        run: |
          python3 - <<'EOF'
          import io
          p = 'tsconfig.host.json'
          s = io.open(p, encoding='utf-8').read()
          anchor = '  "exclude": [\n'
          line = '    "packages/extensions/dsh-deepseek-billing/tests",\n'
          assert anchor in s, 'tsconfig.host.json exclude anchor not found'
          if line not in s:
              s = s.replace(anchor, anchor + line, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched tsconfig.host.json exclude')
          EOF

      - name: Build Harness host contracts
        working-directory: harness
        run: pnpm run build:lib:host

      - name: Build and test plugin
        working-directory: harness
        run: pnpm --filter dsh-deepseek-billing verify

      - name: Verify package contents
        working-directory: harness/packages/extensions/dsh-deepseek-billing
        run: npm pack --dry-run
